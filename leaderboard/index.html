<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard</title>
<!--
  Big-screen leaderboard + play counter for any Slingshot variant.
  Set the two values below (or pass ?api=...&game=... in the URL). Add ?demo to preview with fake data.
  Refreshes every 30 seconds; safe to leave open on a TV at an event.
-->
<script>
const CONFIG = {
  api: 'https://script.google.com/macros/s/AKfycbz3hC8h7GBVOdxbrVbQqtGk5qSY6XHyEmRoqYtrmfn3VXKYvr4rxbqqStQZpNvQEC8/exec',
  game: 'pisgah-vs-tuscola',       // the variant's id
  title: 'Pisgah vs Tuscola',
  refreshSecs: 30,
};
</script>
<style>
:root{--bg:#0b1020;--card:#141a36;--line:rgba(255,255,255,.1);--text:#fff;--dim:rgba(255,255,255,.6);--gold:#ffd25a;--accent:#ff5a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:clamp(16px,3vw,48px)}
h1{margin:0 0 4px;font-size:clamp(28px,4.5vw,64px);font-weight:900;letter-spacing:.03em}
.sub{color:var(--dim);font-size:clamp(13px,1.3vw,18px);margin-bottom:clamp(16px,2.5vw,36px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(10px,1.5vw,20px);margin-bottom:clamp(16px,2.5vw,36px)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,1.6vw,22px)}
.stat b{display:block;font-size:clamp(28px,4vw,60px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);font-size:clamp(11px,1vw,15px);letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(14px,2vw,28px)}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2vw,28px)}
.card h2{margin:0 0 12px;font-size:clamp(16px,1.6vw,24px);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:clamp(8px,1vw,14px) 4px;border-bottom:1px solid var(--line);font-size:clamp(16px,2vw,30px)}
li:last-child{border-bottom:0}
li .rk{width:1.8em;text-align:center;font-weight:900;color:var(--dim)}
li:nth-child(1) .rk{color:var(--gold)} li:nth-child(2) .rk{color:#d6dde6} li:nth-child(3) .rk{color:#e0a26a}
li .nm{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sc{font-weight:900;font-variant-numeric:tabular-nums}
li small{color:var(--dim);font-size:.55em;margin-left:6px}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lv .card{padding:14px 16px}
.lv h3{margin:0 0 6px;font-size:15px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.lv li{font-size:clamp(14px,1.3vw,18px);padding:6px 2px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:linear-gradient(180deg,var(--accent),#7a1410);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;background:#000;padding:2px 6px;border-radius:4px}
.empty{color:var(--dim);font-size:18px;padding:20px 0}
.foot{color:var(--dim);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1 id="t"></h1>
  <div class="sub" id="s">Loading…</div>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="card"><h2>🏆 Top players · all levels</h2><ol id="top"></ol></div>
    <div class="card"><h2>Plays · last 14 days</h2><div class="bars" id="bars"></div><div class="lv" id="lv" style="margin-top:18px"></div></div>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const api = q.get('api') || CONFIG.api, game = q.get('game') || CONFIG.game, demo = q.has('demo');
document.getElementById('t').textContent = q.get('title') || CONFIG.title;
document.title = (q.get('title') || CONFIG.title) + ' · Leaderboard';
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function get(params) {
  if (demo) return fake(params);
  const u = api + (api.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ game }, params));
  const r = await fetch(u, { cache: 'no-store' }); return r.json();
}
function fake(p) {
  const names = ['Big Red Bear 42', 'Josh', 'Smoky Claw 17', 'Coach K', 'Midnight Cub 88', 'Ridge Growler 23', 'Sarah', 'Iron Bruin 61', 'Blitz Paw 30', 'Turbo Kodiak 12'];
  if (p.action === 'leaderboard') return { top: names.slice(0, p.level ? 3 : 10).map((n, i) => ({ name: n, score: (p.level ? 60000 : 260000) - i * (p.level ? 7000 : 19000), levels: 5 - (i >> 2) })) };
  return { plays: 1284, games: 402, visits: 517, players: 311, namedPlayers: 128, wins: 640, playsToday: 96, plays24h: 131,
    byDay: Array.from({ length: 14 }, (_, i) => ({ day: 'd' + i, plays: Math.round(40 + 60 * Math.abs(Math.sin(i * .7)) + (i === 13 ? 50 : 0)) })),
    byLevel: [1, 2, 3, 4, 5].map(l => ({ level: l, plays: 420 - l * 60, winRate: 92 - l * 11, avgScore: 30000 + l * 6000 })) };
}
async function load() {
  if (!api && !demo) { document.getElementById('s').textContent = 'Not connected yet: set CONFIG.api in this file, or open with ?api=YOUR_APPS_SCRIPT_URL  (add ?demo to preview).'; return; }
  try {
    const [st, lb] = await Promise.all([get({ action: 'stats' }), get({ action: 'leaderboard', limit: 10 })]);
    const per = await Promise.all((st.byLevel || []).map(l => get({ action: 'leaderboard', level: l.level, limit: 3 }).then(r => [l, r])));
    document.getElementById('s').textContent = demo ? 'Demo data' : 'Live · updates every ' + CONFIG.refreshSecs + 's';
    document.getElementById('stats').innerHTML = [
      ['Plays', st.plays], ['Players', st.players], ['Plays today', st.playsToday], ['Levels won', st.wins], ['Named players', st.namedPlayers],
    ].map(([k, v]) => `<div class="stat"><b>${fmt(v)}</b><span>${k}</span></div>`).join('');
    document.getElementById('top').innerHTML = (lb.top || []).length ? lb.top.map((r, i) => `<li><span class="rk">${i + 1}</span><span class="nm">${esc(r.name)}<small>${r.levels} lvl</small></span><span class="sc">${fmt(r.score)}</span></li>`).join('') : '<div class="empty">No scores yet. Be the first!</div>';
    const mx = Math.max(1, ...(st.byDay || []).map(d => d.plays));
    document.getElementById('bars').innerHTML = (st.byDay || []).map(d => `<div style="height:${d.plays / mx * 100}%" data-t="${esc(d.day)}: ${d.plays}"></div>`).join('');
    document.getElementById('lv').innerHTML = per.map(([l, r]) => `<div class="card"><h3>Level ${l.level} · ${fmt(l.plays)} plays · ${l.winRate}% win</h3><ol>${(r.top || []).map((x, i) => `<li><span class="rk">${i + 1}</span><span class="nm">${esc(x.name)}</span><span class="sc">${fmt(x.score)}</span></li>`).join('') || '<div class="empty" style="font-size:14px;padding:4px 0">—</div>'}</ol></div>`).join('');
    document.getElementById('foot').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) { document.getElementById('s').textContent = 'Couldn’t reach the scoreboard (' + e.message + '). Retrying…'; }
}
load(); setInterval(load, CONFIG.refreshSecs * 1000);
</script>
</body>
</html>
