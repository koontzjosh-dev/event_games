<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2a1f">
<title>Critter Kart</title>
<style>
  :root { --bg: #1d2a1f; --card: #263627; --line: #3d5440; --text: #f1ead8; --dim: #c9c2ae; --gold: #e8b04a; --red: #c94b3a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#game { position: fixed; left: 0; top: 0; display: block; }
  .px { font-family: "Courier New", monospace; font-weight: 900; letter-spacing: 0.02em; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #loading { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: var(--bg); z-index: 50; font-size: 22px; }

  #loading.on { display: flex; }
  /* overlays */
  .screen { position: fixed; inset: 0; display: none; z-index: 10; overflow-y: auto; touch-action: pan-y;
    background: linear-gradient(rgba(29,42,31,0.55), rgba(29,42,31,0.88)); padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  .screen.on { display: block; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-top: 44px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  h1 { margin: 6px 0 0; font-size: clamp(34px, 7vw, 64px); line-height: 1; color: var(--gold); text-shadow: 4px 4px 0 #000; }
  .sub { margin: 0; color: var(--dim); font-size: 17px; }
  #racers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; }
  #tracks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; }
  .track { background: var(--card); border: 3px solid var(--line); padding: 8px; display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto 1fr auto; column-gap: 10px; text-align: left; align-items: start; }
  .track img { grid-row: 1 / 4; width: 76px; height: 76px; image-rendering: pixelated; }
  .track .tn { font-size: 18px; font-weight: 900; }
  .track .tb { font-size: 13px; color: var(--dim); line-height: 1.3; }
  .track .tt { font-size: 13px; color: var(--gold); }
  .track:hover { border-color: #6b8a6e; }
  .track.on { border-color: var(--gold); background: #33472f; box-shadow: 0 0 0 2px rgba(232,176,74,0.35); }
  #speeds { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .spd-l { color: var(--dim); font-size: 15px; margin-right: 4px; }
  .spd { background: var(--card); border: 3px solid var(--line); padding: 8px 18px; min-height: 44px; font-weight: 900; font-size: 16px; }
  .spd:hover { border-color: #6b8a6e; }
  .spd.on { border-color: var(--gold); background: var(--gold); color: #1d2a1f; }
  .racer { background: var(--card); border: 3px solid var(--line); padding: 10px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; transition: transform .08s; }
  .racer:hover, .racer:focus-visible { border-color: var(--gold); outline: none; transform: translateY(-3px); }
  .racer img { width: 100%; aspect-ratio: 1; max-height: 30vh; object-fit: contain; image-rendering: pixelated; background: #263627; }
  .rn { font-size: 22px; font-weight: 900; }
  .rk { color: var(--dim); font-size: 14px; margin-top: -4px; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 12px; color: var(--dim); margin-top: 4px; }
  .bar { height: 8px; background: #141e15; display: block; }
  .bar i { display: block; height: 100%; background: var(--gold); }
  .rb { font-size: 13px; color: var(--text); margin-top: 4px; }
  #controls, #best { color: var(--dim); font-size: 15px; margin: 0; }
  #controls b { color: var(--text); }
  @media (max-width: 760px), (max-height: 520px) {
    #racers { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .racer { padding: 6px; } .rn { font-size: 16px; } .rk, .rb { display: none; } .stats { font-size: 10px; }
    h1 { font-size: 34px; } .sub { font-size: 14px; }
  }
  @media (max-width: 760px), (max-height: 520px) {
    .track { grid-template-columns: 48px 1fr; padding: 6px; } .track img { width: 48px; height: 48px; }
    .track .tn { font-size: 14px; } .track .tb { display: none; }
  }
  @media (max-width: 520px) { #racers, #tracks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud.on { display: block; }
  .chip { position: absolute; background: rgba(29,42,31,0.82); border: 3px solid #141e15; padding: 6px 12px; }
  #tl { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); }
  #lap { font-size: 22px; } #time { font-size: 16px; color: var(--gold); }
  #pos { position: absolute; top: max(4px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); font-size: 56px; color: #fff; text-shadow: 4px 4px 0 #141e15, -2px -2px 0 #141e15, 2px -2px 0 #141e15, -2px 2px 0 #141e15; }
  #item { bottom: 16px; left: max(12px, env(safe-area-inset-left)); width: 70px; height: 70px; padding: 0; display: flex; align-items: center; justify-content: center; opacity: 0.45; }
  #item { opacity: 0.5; border-style: dashed; }
  #item svg { filter: grayscale(1) brightness(0.7); }
  #item.has { opacity: 1; border-style: solid; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,176,74,0.35), 0 0 18px rgba(232,176,74,0.65); }
  #item.has svg { filter: none; }
  #item.pop { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-8deg); } 70% { transform: scale(0.92) rotate(4deg); } 100% { transform: scale(1); } }
  #item svg, #item-icon { width: 44px; height: 44px; display: block; }
  #item-n { position: absolute; right: -10px; top: -12px; font-size: 18px; color: #1d2a1f; background: var(--gold); border: 2px solid #141e15; padding: 0 4px; }
  #item-n:empty { display: none; }
  #mini { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 14px; width: 150px; height: 150px; background: rgba(29,42,31,0.7); border: 3px solid #141e15; image-rendering: pixelated; }
  #msg { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(0.6); opacity: 0; transition: opacity .15s, transform .15s; z-index: 6; pointer-events: none;
    font-size: 40px; color: #fff; text-shadow: 4px 4px 0 #141e15; white-space: nowrap; }
  #msg.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #msg.big { font-size: clamp(56px, 12vw, 110px); color: var(--gold); }
  #wrong { position: fixed; left: 50%; top: 52%; transform: translateX(-50%); display: none; background: var(--red); padding: 8px 18px; font-size: 26px; z-index: 6; border: 3px solid #141e15; }
  #wrong.on { display: block; }
  #mute, #fs { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; z-index: 20; pointer-events: auto; background: rgba(29,42,31,0.82); border: 3px solid #141e15; width: 44px; height: 44px; padding: 0; display: none; align-items: center; justify-content: center; }
  #mute { transform: translateX(-50%); }
  body.can-fs #mute { transform: translateX(calc(-100% - 4px)); }
  #fs { transform: translateX(4px); }
  body.racing #mute, #menu.on ~ #mute { display: flex; }
  body.can-fs.racing #fs, body.can-fs #menu.on ~ #fs { display: flex; }
  #mute svg, #fs svg { width: 24px; height: 24px; }
  #fs.on .enter { display: none; } #fs:not(.on) .exit { display: none; } #mute.off .wave { display: none; } #mute:not(.off) .x { display: none; }

  /* touch controls */
  .tc { display: none; position: fixed; z-index: 7; pointer-events: auto; background: rgba(29,42,31,0.55); border: 3px solid rgba(241,234,216,0.55); color: var(--text);
    align-items: center; justify-content: center; font-weight: 900; font-size: 18px; touch-action: none; }
  .tc.on { background: rgba(232,176,74,0.6); }
  body.touch.racing .tc { display: flex; }
  /* left thumb: steering. right thumb: jump (biggest), item above it, brake beside it */
  #t-left, #t-right { bottom: max(16px, env(safe-area-inset-bottom)); width: 96px; height: 96px; }
  #t-left { left: max(14px, env(safe-area-inset-left)); } #t-right { left: calc(max(14px, env(safe-area-inset-left)) + 108px); }
  #t-jump { right: max(14px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 104px; height: 96px; font-size: 20px; border-radius: 50%; }
  #t-brake { right: calc(max(14px, env(safe-area-inset-right)) + 116px); bottom: max(16px, env(safe-area-inset-bottom)); width: 84px; height: 64px; font-size: 15px; }
  #t-item { right: max(14px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 108px); width: 104px; height: 78px; opacity: 0.45; flex-direction: column; gap: 2px; font-size: 12px; }
  #t-item-icon svg { width: 36px; height: 36px; display: block; }
  #t-item:not(.ready) #t-item-icon { filter: grayscale(1) brightness(0.7); }
  #t-item.ready { opacity: 1; background: rgba(232,176,74,0.85); color: #1d2a1f; border-color: #fff4d0; animation: ready 0.9s ease-in-out infinite; }
  @keyframes ready { 50% { box-shadow: 0 0 0 6px rgba(232,176,74,0.45); } }
  #t-left svg, #t-right svg { width: 40px; height: 40px; }
  body.touch #item { display: none; } /* the ITEM button shows what you're holding */
  body.touch #mini { width: 104px; height: 104px; top: calc(max(4px, env(safe-area-inset-top)) + 70px); bottom: auto; }
  @media (max-height: 420px) { body.touch #mini { width: 88px; height: 88px; top: 64px; } body.touch #pos { font-size: 44px; } }

  /* results & pause */
  .panel { background: var(--card); border: 3px solid var(--line); padding: 18px 22px; width: min(520px, 100%); }
  #results .wrap, #pause .wrap { min-height: 100%; justify-content: center; padding-top: 0; }
  #results, #pause { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .panel h2 { margin: 0 0 12px; font-size: 34px; color: var(--gold); }
  #res-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #res-list li { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 8px 10px; background: #1d2a1f; text-align: left; font-size: 18px; align-items: center; }
  #res-list li.me { outline: 3px solid var(--gold); }
  #res-list i { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid #141e15; vertical-align: -1px; }
  #res-best { color: var(--dim); margin: 0 0 14px; }
  #res-top { margin: 0 0 14px; text-align: left; }
  #res-top h3 { margin: 0 0 6px; font-size: 16px; color: var(--gold); }
  #res-top-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  #res-top-list li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; padding: 4px 10px; background: #1d2a1f; font-size: 15px; }
  #res-top-list li.me { outline: 2px solid var(--gold); }
  #res-top-list li.dim { display: block; color: var(--dim); }
  #namebar { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #pname { background: #141e15; color: var(--text); border: 3px solid var(--line); padding: 8px 12px; font-size: 17px; font-weight: 800; min-height: 44px; width: min(230px, 52vw); font-family: inherit; }
  #pname:focus { outline: none; border-color: var(--gold); }
  #pname::placeholder { color: #8f8a78; font-weight: 600; }
  #reroll { padding: 8px 12px; }
  #lb-link { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
  #pname-note { flex-basis: 100%; text-align: center; color: #ff9c86; font-size: 14px; min-height: 0; }
  #pname-note:empty { display: none; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { background: var(--gold); color: #1d2a1f; border: 3px solid #141e15; padding: 12px 20px; font-size: 18px; font-weight: 900; min-height: 48px; }
  @media (max-height: 500px) {
    .panel { padding: 10px 16px; }
    .panel h2 { font-size: 24px; margin-bottom: 8px; }
    #res-list { gap: 4px; margin-bottom: 6px; }
    #res-list li { padding: 4px 10px; font-size: 15px; }
    #res-best { margin-bottom: 8px; font-size: 14px; }
    #results .panel { width: min(860px, 100%); }
    .res-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    #res-top { margin-bottom: 8px; } #res-top h3 { font-size: 13px; margin-bottom: 3px; } #res-top-list li { padding: 3px 8px; font-size: 14px; }
    .btn { padding: 6px 16px; font-size: 16px; min-height: 44px; }
  }
  .btn.alt { background: transparent; color: var(--text); border-color: var(--line); }

  #rotate { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--bg); text-align: center; padding: 24px; font-size: 22px; font-weight: 700; }
  #rotate.on { display: flex; }
  #rotate .phone { width: 54px; height: 92px; border: 4px solid #fff; border-radius: 12px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading" class="px on">Building the track…</div>

<section id="menu" class="screen" aria-label="Choose a racer">
  <div class="wrap">
    <h1 class="px">CRITTER KART</h1>
    <p class="sub">Pick a track, then pick your critter</p>
    <div id="tracks"></div>
    <div id="speeds" role="group" aria-label="Speed"></div>
    <div id="namebar">
      <label for="pname" class="spd-l">Racer name</label>
      <input id="pname" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-describedby="pname-note">
      <button id="reroll" class="spd" type="button" title="Random name" aria-label="Pick a random name">🎲</button>
      <a id="lb-link" class="spd" href="leaderboard.html" target="_blank" rel="noopener">🏆 Leaderboard</a>
      <span id="pname-note" role="status"></span>
    </div>
    <div id="racers"></div>
    <p id="controls"></p>
    <p id="best"></p>
  </div>
</section>

<div id="hud">
  <div id="tl" class="chip px"><div id="lap">Lap 1/3</div><div id="time">0:00.0</div></div>
  <div id="pos" class="px">4th</div>
  <div id="item" class="chip"><span id="item-icon"></span>
    <span id="item-n" class="px"></span>
  </div>
  <canvas id="mini"></canvas>
  <div id="wrong" class="px">WRONG WAY</div>
</div>
<div id="msg" class="px"></div>

<button id="t-left" class="tc" aria-label="Steer left"><svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 1 L2 5 L7 9 Z" fill="currentColor"/></svg></button>
<button id="t-right" class="tc" aria-label="Steer right"><svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 1 L8 5 L3 9 Z" fill="currentColor"/></svg></button>
<button id="t-item" class="tc px" aria-label="Use item"><span id="t-item-icon"></span><span id="t-item-label">ITEM</span></button>
<button id="t-jump" class="tc px" aria-label="Jump">JUMP</button>
<button id="t-brake" class="tc px">BRAKE</button>

<section id="results" class="screen" aria-label="Race results">
  <div class="wrap"><div class="panel">
    <h2 id="res-title" class="px">Results</h2>
    <div class="res-cols">
      <div><ol id="res-list"></ol><p id="res-best"></p></div>
      <div id="res-top"><h3 class="px">Top 5 · <span id="res-top-t"></span></h3><ol id="res-top-list"></ol></div>
    </div>
    <div class="btns"><button id="again" class="btn px">Race again</button><button id="change" class="btn alt px">Change racer</button></div>
  </div></div>
</section>

<section id="pause" class="screen" aria-label="Paused">
  <div class="wrap"><div class="panel">
    <h2 class="px">Paused</h2>
    <div class="btns"><button id="resume" class="btn px">Resume</button><button id="quit" class="btn alt px">Quit to menu</button></div>
  </div></div>
</section>

<button id="mute" aria-label="Sound on or off">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f1ead8" stroke-width="2.4" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="#f1ead8"/><path class="wave" d="M16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14"/><path class="x" d="M16 9l6 6M22 9l-6 6"/>
  </svg>
</button>

<button id="fs" aria-label="Full screen on or off">
  <svg viewBox="0 0 24 24" fill="none" stroke="#f1ead8" stroke-width="2.6" stroke-linecap="square" aria-hidden="true">
    <path class="enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
    <path class="exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
  </svg>
</button>

<div id="rotate"><div class="phone"></div><div>Turn your phone sideways</div></div>

<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
