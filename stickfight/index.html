<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>Stick Fight</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b1020;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #0b1020; color: #fff; text-align: center; padding: 24px;
    font: 700 22px/1.3 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #rotate.on { display: flex; }
  #rotate .phone {
    width: 54px; height: 92px; border: 4px solid #fff; border-radius: 12px;
    animation: tilt 1.8s ease-in-out infinite;
  }
  @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div class="phone"></div><div id="rotate-text">Turn your phone sideways</div></div>

<script src="theme.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fighter.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script>
  // Offline support: network-first service worker, scoped to this folder only.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
