<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pisgah Band · Knight Tournament</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Slingshot engine styles. Themes recolor via the CSS variables below (set them in theme.css). */
:root{
  --page-bg:#0b1020;
  --shuffle:linear-gradient(180deg,#4a5578,#2a3150); --shuffle-edge:#141a30;
  --panel-bg:radial-gradient(ellipse at center,rgba(30,10,12,.55),rgba(8,4,6,.9));
  --title1:linear-gradient(180deg,#fff 0%,#ff5a4a 50%,#c4161c);
  --title2:linear-gradient(180deg,#fff7b0 0%,#ffd21a 50%,#e0a800);
  --btn:linear-gradient(180deg,#ff5a4a,#c4161c); --btn-edge:#6a0a0e; --btn-text:#fff;
  --alt:linear-gradient(180deg,#444,#161616); --alt-edge:#000; --alt-text:#ffd21a;
  --star:#ffd25a; --hover:#ffd25a;
  --hud-bg:rgba(20,24,50,.55); --hud-bg-solid:rgba(20,24,50,.78);
  --special:linear-gradient(180deg,#3fbf55,#1e7a32); --special-edge:#0f4a1d; --special-glow:#7dff8a;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--page-bg);overflow:hidden;font-family:var(--font);overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:1280px;height:720px;--u:1px;overflow:hidden;border-radius:calc(10*var(--u));box-shadow:0 20px 80px rgba(0,0,0,.6);contain:layout paint}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.hidden{display:none!important}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(14*var(--u)) calc(18*var(--u));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
/* Blur behind HUD pills is re-computed every frame over a moving canvas: costly on phones, so it is desktop-only (.fine). */
.pill{background:var(--hud-bg-solid);color:#fff;border-radius:calc(14*var(--u));padding:calc(8*var(--u)) calc(16*var(--u));font-weight:800;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
#score{font-size:calc(26*var(--u));min-width:calc(190*var(--u))}
#score small{display:block;font-size:calc(11*var(--u));opacity:.7;letter-spacing:.18em}
#lvlname{font-size:calc(13*var(--u));opacity:.85;margin-top:calc(6*var(--u))}
#btns{display:flex;gap:calc(8*var(--u));pointer-events:auto}
.ib{width:calc(46*var(--u));height:calc(46*var(--u));min-width:32px;min-height:32px;border-radius:calc(14*var(--u));border:1px solid rgba(255,255,255,.25);background:var(--hud-bg-solid);color:#fff;font-size:calc(22*var(--u));cursor:pointer;transition:transform .12s,background .12s;padding:0}
.fine .pill,.fine .ib{background:var(--hud-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fine .ib:hover{transform:translateY(-2px);background:rgba(60,70,140,.7)}
.ib:active{transform:scale(.94)}
.special{position:absolute;right:calc(18*var(--u));top:calc(76*var(--u));font-family:inherit;font-weight:900;font-size:calc(15*var(--u));letter-spacing:.05em;color:#fff;background:var(--special);border:2px solid var(--special-edge);border-radius:calc(14*var(--u));padding:calc(10*var(--u)) calc(16*var(--u));cursor:pointer;box-shadow:0 calc(4*var(--u)) 0 var(--special-edge);z-index:3}
.special:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.special.pulse{animation:pulse .8s infinite alternate}
.special.pulse::after{content:"";position:absolute;inset:-2px;border-radius:inherit;box-shadow:0 0 calc(24*var(--u)) var(--special-glow);animation:glow .8s infinite alternate;pointer-events:none}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes glow{from{opacity:0}to{opacity:1}}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel-bg);color:#fff;text-align:center;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
h1{margin:0;font-size:calc(74*var(--u));line-height:1;font-weight:900;letter-spacing:.04em}
h1 em,h1 b{display:block;font-style:normal;-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{background-image:var(--title1);filter:drop-shadow(0 calc(5*var(--u)) 0 #000)}
h1 b{background-image:var(--title2);filter:drop-shadow(0 calc(5*var(--u)) 0 #000)}
h1 span{display:block;font-size:calc(28*var(--u));letter-spacing:.5em;color:#fff;margin:calc(4*var(--u)) 0;text-shadow:0 2px 0 #000}
.sub{margin:calc(14*var(--u)) 0 calc(24*var(--u));opacity:.8;font-size:calc(16*var(--u))}
#levels{display:flex;gap:calc(14*var(--u));margin-bottom:calc(26*var(--u))}
.lvl{width:calc(150*var(--u));padding:calc(14*var(--u)) calc(8*var(--u));border-radius:calc(18*var(--u));border:2px solid rgba(255,255,255,.25);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));color:#fff;cursor:pointer;font-family:inherit;transition:transform .15s,border-color .15s}
.fine .lvl:hover:not(:disabled){transform:translateY(calc(-6*var(--u))) rotate(-1.5deg);border-color:var(--hover)}
.lvl:disabled{opacity:.4;cursor:not-allowed}
.lvl b{display:block;font-size:calc(40*var(--u));line-height:1.1}
.lvl i{display:block;font-style:normal;font-size:calc(12*var(--u));opacity:.85;min-height:calc(30*var(--u));padding:0 calc(4*var(--u))}
.lvl .st{font-size:calc(20*var(--u));color:var(--star);letter-spacing:.1em}
.lvl .st s{text-decoration:none;color:rgba(255,255,255,.25)}
.btn{font-family:inherit;font-weight:900;font-size:calc(22*var(--u));padding:calc(12*var(--u)) calc(34*var(--u));border-radius:calc(16*var(--u));border:0;cursor:pointer;color:var(--btn-text);background:var(--btn);box-shadow:0 calc(6*var(--u)) 0 var(--btn-edge),0 calc(12*var(--u)) calc(24*var(--u)) rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s;margin:0 calc(6*var(--u))}
.fine .btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(calc(4*var(--u)));box-shadow:0 calc(2*var(--u)) 0 var(--btn-edge)}
.btn.alt{background:var(--alt);color:var(--alt-text);box-shadow:0 calc(6*var(--u)) 0 var(--alt-edge),0 calc(12*var(--u)) calc(24*var(--u)) rgba(0,0,0,.4)}
/* name entry sits beside PLAY so the menu is no taller than before */
.go{display:flex;align-items:center;gap:calc(14*var(--u))}
.who{display:flex;align-items:center;gap:calc(6*var(--u));background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);border-radius:calc(14*var(--u));padding:calc(6*var(--u)) calc(6*var(--u)) calc(6*var(--u)) calc(14*var(--u))}
.who span{font-size:calc(12*var(--u));letter-spacing:.12em;text-transform:uppercase;opacity:.7;white-space:nowrap}
.who input{width:calc(250*var(--u));min-width:165px;font:700 max(16px,calc(18*var(--u))) var(--font);color:#fff;background:transparent;border:0;outline:0;padding:calc(4*var(--u)) 0;user-select:text;-webkit-user-select:text}
.who input::placeholder{color:rgba(255,255,255,.55)}
.who button{border:0;background:rgba(255,255,255,.12);border-radius:calc(10*var(--u));font-size:max(16px,calc(18*var(--u)));width:calc(40*var(--u));height:calc(40*var(--u));min-width:30px;min-height:30px;cursor:pointer;padding:0}
#end h2{margin:0;font-size:calc(62*var(--u));font-weight:900;text-shadow:0 calc(5*var(--u)) 0 rgba(0,0,0,.4)}
#endStars{font-size:calc(80*var(--u));color:var(--star);letter-spacing:.1em;margin:calc(6*var(--u)) 0;text-shadow:0 calc(4*var(--u)) 0 #8a4b00}
#endStars s{text-decoration:none;color:rgba(255,255,255,.2);text-shadow:none}
#endScore{font-size:calc(28*var(--u));font-weight:800;margin-bottom:calc(6*var(--u))}
#endWho{font-size:calc(14*var(--u));opacity:.7;margin-bottom:calc(22*var(--u))}
#endBonus{font-size:calc(15*var(--u));opacity:.8;margin-bottom:calc(6*var(--u))}
.toast{position:absolute;left:50%;bottom:calc(60*var(--u));transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:calc(10*var(--u)) calc(18*var(--u));border-radius:calc(10*var(--u));font-size:max(12px,calc(14*var(--u)));z-index:9;pointer-events:none;max-width:90%}
.hint{position:absolute;bottom:calc(26*var(--u));color:#fff;opacity:.55;font-size:calc(13*var(--u))}
#rotate{display:none;position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#fff;opacity:.7;font:600 15px var(--font)}
@media (orientation:portrait) and (max-width:820px){#rotate{display:block}}

/* optional lineup shuffle button (theme.shuffle) — sits under the level name */
.shuffle{position:absolute;left:calc(18*var(--u));top:calc(132*var(--u));font-family:inherit;font-weight:900;font-size:calc(14*var(--u));letter-spacing:.05em;color:#fff;background:var(--shuffle);border:2px solid var(--shuffle-edge);border-radius:calc(14*var(--u));padding:calc(9*var(--u)) calc(14*var(--u));min-height:36px;cursor:pointer;box-shadow:0 calc(4*var(--u)) 0 var(--shuffle-edge);z-index:3}
.shuffle:active{transform:translateY(2px)}
.shuffle:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}

/* optional leaderboard link on the level picker (theme.leaderboard) — top-left, opposite full screen */
.lbLink{position:absolute;top:calc(14*var(--u));left:calc(18*var(--u));display:flex;align-items:center;height:calc(46*var(--u));min-height:32px;padding:0 calc(16*var(--u));border-radius:calc(14*var(--u));border:1px solid rgba(255,255,255,.25);background:var(--hud-bg-solid);color:#fff;font:800 max(13px,calc(16*var(--u))) var(--font);letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.lbLink:active{transform:scale(.96)}
.fine .lbLink:hover{border-color:var(--hover)}

</style>
</head>
