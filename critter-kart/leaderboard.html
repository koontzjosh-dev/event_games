<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critter Kart · Leaderboard</title>
<!--
  Big-screen leaderboard for Critter Kart: the five fastest racers on each track, per speed.
  Reads the same Google Sheet (Apps Script) as the slingshot games, game id 'critter-kart'.
  Each track + speed is a "level" there: track number x 10 + speed (Blocky Ridge Easy = 11 ... Frosty Peaks Turbo = 43),
  and the score is 400000 minus the race time in milliseconds (so the highest score is the fastest time).
  URL options: ?speed=fast  ?cycle=20 (rotate Easy/Fast/Turbo every 20 s on a TV)  ?demo (fake data)  ?api=... (another Sheet)
  Refreshes every 30 seconds; safe to leave open on a TV at an event.
-->
<script>
const CONFIG = {
  api: 'https://script.google.com/macros/s/AKfycbz3hC8h7GBVOdxbrVbQqtGk5qSY6XHyEmRoqYtrmfn3VXKYvr4rxbqqStQZpNvQEC8/exec',
  game: 'critter-kart',
  refreshSecs: 30,
  // same order as TRACKS in src/main.js (the order decides the level numbers)
  tracks: [
    { name: 'Blocky Ridge', color: '#6fae4b' },
    { name: 'Canyon Crossover', color: '#dba06a' },
    { name: 'Firefly Hollow', color: '#5a7ac8' },
    { name: 'Frosty Peaks', color: '#bfe3f5' },
  ],
  speeds: ['Easy', 'Fast', 'Turbo'],
};
</script>
<style>
:root { --bg: #1d2a1f; --card: #263627; --line: #3d5440; --text: #f1ead8; --dim: #c9c2ae; --gold: #e8b04a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
.px { font-family: "Courier New", ui-monospace, monospace; font-weight: 900; letter-spacing: 0.02em; }
main { max-width: 1500px; margin: 0 auto; padding: clamp(14px, 3vw, 44px); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(14px, 2vw, 28px); }
h1 { margin: 0; font-size: clamp(30px, 5vw, 68px); line-height: 1; color: var(--gold); text-shadow: 4px 4px 0 #000; }
.sub { color: var(--dim); font-size: clamp(13px, 1.3vw, 18px); margin-top: 6px; }
.speeds { display: flex; gap: 8px; }
.speeds button { background: var(--card); color: var(--text); border: 3px solid var(--line); padding: 8px 18px; min-height: 44px; font-size: clamp(14px, 1.4vw, 20px); cursor: pointer; }
.speeds button.on { background: var(--gold); color: #1d2a1f; border-color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(10px, 1.5vw, 18px); margin-bottom: clamp(14px, 2vw, 28px); }
.stat { background: var(--card); border: 3px solid var(--line); padding: clamp(10px, 1.4vw, 18px); }
.stat b { display: block; font-size: clamp(26px, 3.6vw, 54px); line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--dim); font-size: clamp(11px, 1vw, 14px); letter-spacing: 0.12em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2vw, 26px); }
@media (min-width: 1180px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid li { font-size: clamp(15px, 1.35vw, 30px); gap: 10px; } .grid li .rk { width: 1.2em; } }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 3px solid var(--line); padding: clamp(12px, 1.8vw, 24px); border-top-width: 8px; }
.card h2 { margin: 0 0 10px; font-size: clamp(18px, 2vw, 30px); }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 14px; padding: clamp(6px, 0.9vw, 12px) 4px; border-bottom: 2px solid var(--line); font-size: clamp(16px, 1.9vw, 28px); }
li:last-child { border-bottom: 0; }
li .rk { width: 1.6em; text-align: center; color: var(--dim); }
li:nth-child(1) .rk { color: var(--gold); } li:nth-child(2) .rk { color: #d6dde6; } li:nth-child(3) .rk { color: #e0a26a; }
li .nm { flex: 1; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .tm { font-variant-numeric: tabular-nums; }
.empty { color: var(--dim); font-size: clamp(14px, 1.4vw, 20px); padding: 14px 0; }
.foot { color: var(--dim); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1 class="px">CRITTER KART</h1><div class="sub" id="s">Loading…</div></div>
    <div class="speeds" id="speeds"></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const api = q.get('api') || CONFIG.api, game = q.get('game') || CONFIG.game, demo = q.has('demo');
const cycle = Number(q.get('cycle')) || 0;
let speed = Math.max(0, CONFIG.speeds.findIndex((s) => s.toLowerCase() === String(q.get('speed') || '').toLowerCase()));
const TIME_BASE = 400000;
const fmtN = (n) => Math.round(n || 0).toLocaleString('en-US');
const fmtT = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const level = (t, sp) => (t + 1) * 10 + sp + 1;
async function get(params) {
  if (demo) return fake(params);
  const u = api + (api.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ game }, params));
  const r = await fetch(u, { cache: 'no-store' }); return r.json();
}
function fake(p) {
  const names = ['Josh', 'Turbo Bear 42', 'Sarah', 'Zippy Fox 17', 'Coach K', 'Frosty Owl 88', 'Lucky Moose 23'];
  if (p.action === 'leaderboard') {
    const lv = Number(p.level), base = [140, 162, 150, 172][Math.floor(lv / 10) - 1] / [1, 1.22, 1.45][lv % 10 - 1];
    const n = (lv * 7) % 6;
    return { top: names.slice(0, n).map((name, i) => ({ name, pid: 'ab' + i, score: Math.round(TIME_BASE - (base + i * 2.37 + (lv % 3)) * 1000) })) };
  }
  return { plays: 412, players: 57, namedPlayers: 38, wins: 351, playsToday: 64, byLevel: [] };
}
function drawSpeeds() {
  document.getElementById('speeds').innerHTML = CONFIG.speeds.map((s, i) => `<button class="px ${i === speed ? 'on' : ''}" data-i="${i}">${s}</button>`).join('');
  document.querySelectorAll('#speeds button').forEach((b) => b.addEventListener('click', () => { speed = Number(b.dataset.i); drawSpeeds(); load(); }));
}
async function load() {
  if (!api && !demo) { document.getElementById('s').textContent = 'Not connected: set CONFIG.api in this file (add ?demo to preview).'; return; }
  const sp = speed;
  try {
    const [st, ...boards] = await Promise.all([get({ action: 'stats' }), ...CONFIG.tracks.map((_, t) => get({ action: 'leaderboard', level: level(t, sp), limit: 5 }))]);
    if (sp !== speed) return; // switched speed while loading
    document.getElementById('s').textContent = (demo ? 'Demo data' : 'Fastest racers · live, updates every ' + CONFIG.refreshSecs + 's') + ' · ' + CONFIG.speeds[sp];
    document.getElementById('stats').innerHTML = [['Races', st.plays], ['Finished', st.wins], ['Racers', st.players], ['Races today', st.playsToday]]
      .map(([k, v]) => `<div class="stat"><b class="px">${fmtN(v)}</b><span>${k}</span></div>`).join('');
    document.getElementById('grid').innerHTML = CONFIG.tracks.map((t, i) => {
      const top = (boards[i].top || []).map((x) => ({ name: x.name, time: (TIME_BASE - x.score) / 1000 })).filter((x) => x.time > 0);
      return `<div class="card" style="border-top-color:${t.color}"><h2 class="px">${esc(t.name)}</h2><ol>${top.length
        ? top.map((x, k) => `<li><span class="rk px">${k + 1}</span><span class="nm">${esc(x.name)}</span><span class="tm px">${fmtT(x.time)}</span></li>`).join('')
        : '<div class="empty">No times yet. Be the first!</div>'}</ol></div>`;
    }).join('');
    document.getElementById('foot').textContent = 'Updated ' + new Date().toLocaleTimeString() + (cycle ? ` · speeds rotate every ${cycle}s` : '');
  } catch (e) { document.getElementById('s').textContent = 'Couldn’t reach the scoreboard (' + e.message + '). Retrying…'; }
}
drawSpeeds(); load();
setInterval(load, CONFIG.refreshSecs * 1000);
if (cycle) setInterval(() => { speed = (speed + 1) % CONFIG.speeds.length; drawSpeeds(); load(); }, cycle * 1000);
</script>
</body>
</html>
